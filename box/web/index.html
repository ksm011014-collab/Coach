<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050a10" />
    <meta name="application-name" content="APEX Boxing AI Coach" />
    <title>APEX Boxing AI Coach</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/styles/operations.css">
  </head>
  <body>
    <div id="app" class="shell auth-shell">
      <aside id="sidebar" class="sidebar hidden">
        <div class="brand-row">
          <div class="brand">
            <span class="brand-mark"></span>
            <div class="brand-copy">
              <strong>APEX</strong>
              <small>Boxing AI Coach</small>
            </div>
          </div>
          <button id="sidebarToggle" class="icon-button" title="사이드바 접기">☰</button>
        </div>
        <nav id="nav"></nav>
        <div class="account">
          <span id="userName"></span>
          <button id="logoutButton" class="ghost" title="로그아웃"><span class="logout-icon" aria-hidden="true"><svg class="logout-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></span><span class="logout-label">로그아웃</span></button>
        </div>
      </aside>

      <main class="stage">
        <section id="loginPanel" class="login-panel">
          <div class="intro">
            <div class="hero-orbit" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <p class="eyebrow hero-brand">선랑 제이디씨</p>
            <h1 class="hero-title"><span>센터와 회원의 운동 기록 관리</span><span>에듀·스포츠 B2B SaaS</span></h1>
            <div class="hero-status" aria-hidden="true">
              <span>CAMERA</span>
              <span>SESSION</span>
              <span>RECORDING</span>
            </div>
          </div>

          <div class="auth-card">
            <div class="auth-logo">
              <span class="auth-logo-mark"></span>
              <div>
                <strong>APEX</strong>
                <small>Boxing AI Coach</small>
              </div>
            </div>
            <div class="auth-tabs">
              <button class="auth-tab active" data-auth-mode="owner">관리자</button>
              <button class="auth-tab" data-auth-mode="member">회원</button>
            </div>

            <form id="loginForm" class="auth-form">
              <input name="username" value="" placeholder="아이디" autocomplete="username" />
              <input name="password" value="" type="password" placeholder="비밀번호" autocomplete="current-password" />
              <button id="authSubmit">로그인</button>
              <p id="authMessage" class="form-message"></p>
            </form>
          </div>
        </section>

        <section id="hud" class="hud hidden">
          <video id="cameraPreview" class="hud-camera" autoplay muted playsinline></video>
          <div class="camera-fallback hud-camera" id="cameraFallback">LIVE CAMERA</div>
          <div id="cameraMiniOverlay" class="camera-mini-overlay hidden" aria-label="Additional camera views"></div>
          <div id="cameraOffline" class="camera-offline">
            <strong>카메라 연결 안됨</strong>
            <span>운동 세션을 시작하려면 카메라 권한을 허용하고 장치를 연결하세요.</span>
            <button id="retryCamera">카메라 연결</button>
          </div>
          <article class="overlay camera-status-card">
            <span id="cameraStatus">카메라 대기</span>
            <p id="sessionMessage" role="status">분석 엔진 준비 중 · 카메라와 운동 기록을 사용할 수 있습니다.</p>
          </article>

          <article class="overlay session-card">
            <span>운동 기록</span>
            <strong id="sessionState">대기 중</strong>
            <small id="sessionTimer">00:00</small>
            <div class="session-actions">
              <button id="startSessionHud">시작</button>
              <button id="stopSessionHud" class="danger" disabled>종료</button>
            </div>
          </article>
        </section>

        <section id="workspace" class="workspace hidden">
          <div class="panel">
            <div class="panel-head">
              <h2 id="viewTitle">대시보드</h2>
              <button id="startSession">실시간 세션 시작</button>
            </div>
            <div id="viewContent" class="view-grid"></div>
          </div>
        </section>
      </main>
    </div>
    <aside id="updateBanner" class="update-banner hidden" aria-live="polite">
      <div>
        <strong>새 웹 버전을 사용할 수 있습니다.</strong>
        <span id="updateBannerMessage">운동 중이 아닐 때 안전하게 업데이트할 수 있습니다.</span>
      </div>
      <button id="applyWebUpdate" type="button">업데이트</button>
    </aside>
    <script src="/scripts/operations-service.js"></script>
    <script src="/scripts/operations-ui.js"></script>
    <script src="/scripts/operations-commerce.js"></script>
    <script src="/scripts/operations-shell.js"></script>
    <script src="/scripts/operations-live.js"></script>
    <script src="/scripts/android-offline.js"></script>
    <script src="/scripts/desktop-bridge.js"></script>
    <script src="/scripts/config.js"></script>
    <script src="/scripts/storage.js"></script>
    <script src="/scripts/utils.js"></script>
    <script src="/scripts/auth-shell.js"></script>
    <script src="/scripts/member-home.js"></script>
    <script src="/scripts/accounts.js"></script>
    <script src="/scripts/platform-admin.js"></script>
    <script src="/scripts/preferences.js"></script>
    <script src="/scripts/business.js"></script>
    <script src="/scripts/center.js"></script>
    <script src="/scripts/session.js"></script>
    <script src="/app.js"></script>
    <script src="/scripts/pwa.js"></script>
  </body>
</html>
